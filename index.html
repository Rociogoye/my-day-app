  <title>My Day · Tu día, a tu ritmo</title>
  <!-- Manual de marca My Day: calendario redondeado + sol naciente + marca de avance = organizar el día de forma amable. -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23d7834c'/%3E%3Crect x='14' y='16' width='36' height='34' rx='8' fill='none' stroke='white' stroke-width='4'/%3E%3Cpath d='M14 26h36M23 12v8M41 12v8' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M22 42c3-7 8-10 14-10 3 0 5 1 7 3' fill='none' stroke='%23f7e7d1' stroke-width='3.5' stroke-linecap='round'/%3E%3Cpath d='m37 34 5 1 1-5' fill='none' stroke='%23f7e7d1' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Inter','ui-sans-serif','system-ui']}}}}</script>
  <style>
    :root{--bg:#f7f4ee;--surface:#fffdf9;--ink:#26322e;--muted:#53635c;--line:#d7d0c5;--accent:#d7834c;--accent2:#4f806d;--soft:#f1e2d1;--shadow:0 14px 40px rgba(58,48,35,.08)}
    .dark{--bg:#18211f;--surface:#22302b;--ink:#f4f1e9;--muted:#a9b8af;--line:#3a4943;--soft:#34433c;--shadow:0 14px 40px rgba(0,0,0,.22)}
    *{box-sizing:border-box}html,body{overflow-x:hidden}body{background:radial-gradient(circle at 92% 0%,color-mix(in srgb,var(--soft) 62%,transparent),transparent 28rem),var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui;transition:background .25s,color .25s}.surface{background:color-mix(in srgb,var(--surface) 96%,transparent);border:1px solid var(--line);box-shadow:var(--shadow)}.muted{color:var(--muted)}.line{border-color:var(--line)}button,input,textarea,select{min-height:2.75rem}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent2);outline-offset:3px}.app-header:after{content:'';display:block;height:3px;background:linear-gradient(90deg,#7656b8,#d98da7,#d7834c,#4f806d);opacity:.8}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    button,input,textarea,select{font:inherit}button{cursor:pointer}.nav-btn{color:var(--muted);transition:.2s}.nav-btn.active,.nav-btn:hover{background:var(--soft);color:var(--ink)}.dashboard-feature{position:relative;overflow:hidden;background:linear-gradient(135deg,#eadcf7 0%,#f8e4d5 54%,#e2f0e6 100%);border:0;border-radius:2rem;padding:clamp(1.5rem,4vw,2.5rem);box-shadow:0 22px 55px rgba(105,78,111,.18)}.dark .dashboard-feature{background:linear-gradient(135deg,#46365d,#513d3d 55%,#29473d)}.dashboard-feature:after{content:'';position:absolute;width:15rem;height:15rem;border-radius:50%;right:-5rem;top:-7rem;background:rgba(255,255,255,.25);pointer-events:none}.metric-card{padding:1.15rem!important;min-height:9.2rem;position:relative;overflow:hidden}.metric-card:before{content:'';position:absolute;inset:0 auto 0 0;width:4px;background:var(--accent2)}.metric-card:nth-child(1):before{background:#7656b8}.metric-card:nth-child(2):before{background:#d7834c}.metric-card:nth-child(3):before{background:#4f806d}.metric-card:nth-child(4):before{background:#d98da7}.brand-lockup{border:0;background:transparent;padding:0;border-radius:1rem;box-shadow:none}.brand-mark{width:3.1rem;height:3.1rem;border-radius:1.15rem;display:grid;place-items:center;background:linear-gradient(145deg,#7656b8,#a77ad4);box-shadow:0 8px 18px rgba(118,86,184,.32);transform:rotate(-4deg)}.brand-word{font-size:1.35rem;letter-spacing:-.045em}.brand-sub{font-size:.72rem;color:var(--muted);letter-spacing:.02em}.tag{font-size:.72rem;font-weight:700;padding:.28rem .55rem;border-radius:999px;display:inline-flex;align-items:center;gap:.25rem}.tag-Work{background:#e4effc;color:#24577f}.tag-Entreno{background:#e5f4e8;color:#28613a}.tag-Emma{background:#f9e5ec;color:#8a3f5c}.tag-House{background:#f5ead2;color:#745218}.tag-Travel{background:#e5e8fb;color:#424f99}.tag-Study{background:#eee4fb;color:#633d88}.progress-ring{background:conic-gradient(var(--accent) var(--progress),var(--soft) 0)}.check{accent-color:var(--accent2)}.toast{animation:slide .25s ease}.modal-backdrop{position:fixed;inset:0;background:rgba(20,28,25,.36);backdrop-filter:blur(5px);display:grid;place-items:center;padding:1rem;z-index:60}.modal-card{width:min(100%,30rem);max-height:90vh;overflow:auto}.field{width:100%;border:1px solid var(--line);border-radius:1rem;background:transparent;padding:.75rem 1rem;color:var(--ink);outline:none}.field:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent2) 22%,transparent)}.nav-panel{position:absolute;left:0;right:0;top:100%;padding:0 1rem 1rem;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 96%,transparent);backdrop-filter:blur(16px);z-index:30}.nav-panel-inner{max-width:80rem;margin:auto;padding:1rem;border:1px solid var(--line);border-radius:1.25rem;background:var(--surface);box-shadow:var(--shadow)}.dashboard-chart{background:linear-gradient(180deg,color-mix(in srgb,var(--soft) 45%,var(--surface)),var(--surface));border-radius:1.5rem;padding:1rem;border:1px solid var(--line)}.chart-bar{background:linear-gradient(180deg,#9a78d5,#6f55ad);border-radius:.65rem .65rem .25rem .25rem;min-height:10px;transition:height .3s ease}.eyebrow{font-size:.75rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#6f55ad}.dark .eyebrow{color:#d2bff0}@media(max-width:767px){.nav-panel{padding:0 .75rem .75rem}.nav-panel-inner{padding:.85rem}.hero-image{height:9rem!important}.hero-card{padding:1rem!important}.hero-card .text-2xl{font-size:1.35rem;line-height:1.2}.brand-mark{width:2.75rem;height:2.75rem}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}@keyframes slide{from{transform:translateY(15px);opacity:0}to{transform:none;opacity:1}}
  </style>
</head>
<body>
  <div id="app" class="min-h-screen">
    <header class="app-header sticky top-0 z-20 border-b line relative" style="background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(16px)">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-4">
        <button class="brand-lockup flex items-center gap-3" onclick="showView('today')" aria-label="Ir a Hoy"><span class="brand-mark"><svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><rect x="6" y="8" width="20" height="18" rx="4" fill="none" stroke="white" stroke-width="1.7"/><path d="M6 13h20M11 6v4M21 6v4" stroke="white" stroke-width="1.7" stroke-linecap="round"/><path d="M10 22c2-4 5-6 8-6 2 0 3 .5 4 1.5" fill="none" stroke="#f7e7d1" stroke-width="1.7" stroke-linecap="round"/><path d="m21 17 2 .5.5-2" fill="none" stroke="#f7e7d1" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="text-left"><strong class="brand-word block">My Day</strong></span></button>
        <div class="flex items-center gap-2"><button id="themeBtn" class="w-10 h-10 rounded-xl surface" onclick="toggleTheme()" aria-label="Cambiar tema"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button><button class="w-10 h-10 rounded-xl surface md:hidden" aria-label="Abrir menú" onclick="toggleNavPanel('menu')"><svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></div>
      </div>
      <nav id="nav" class="max-w-7xl mx-auto px-4 sm:px-6 pb-3 flex flex-wrap gap-1 items-center">
        <button class="nav-btn active rounded-xl px-4 py-2 text-sm font-semibold" data-section="today" onclick="showView('today')"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="m4 11 8-7 8 7v8H4v-8Zm5 8v-5h6v5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg> Hoy</button><button class="nav-btn rounded-xl px-4 py-2 text-sm font-semibold" data-section="plan" onclick="showView('planning')"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8 3v4M16 3v4M4 10h16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg> Planificar</button><button class="nav-btn rounded-xl px-4 py-2 text-sm font-semibold" data-section="log" onclick="showView('logging')"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg> Registrar</button><button class="nav-btn rounded-xl px-4 py-2 text-sm font-semibold" data-section="review" onclick="showView('review')"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5 18V9m7 9V5m7 13v-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg> Revisar</button>
      </nav>
      <div id="navPanel" class="nav-panel hidden"><div class="nav-panel-inner"><div id="navPanelContent"></div></div></div>
    </header>
    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8" id="main"></main>
    <footer class="border-t line mt-10" role="contentinfo"><div class="max-w-7xl mx-auto px-4 sm:px-6 py-8 flex flex-col sm:flex-row justify-between gap-5 text-sm"><div class="flex items-start gap-3"><span class="brand-mark" style="width:2.35rem;height:2.35rem"><svg viewBox="0 0 32 32" width="23" height="23" aria-hidden="true"><rect x="6" y="8" width="20" height="18" rx="4" fill="none" stroke="white" stroke-width="1.7"/><path d="M6 13h20M11 6v4M21 6v4" stroke="white" stroke-width="1.7" stroke-linecap="round"/><path d="M10 22c2-4 5-6 8-6 2 0 3 .5 4 1.5" fill="none" stroke="#f7e7d1" stroke-width="1.7" stroke-linecap="round"/><path d="m21 17 2 .5.5-2" fill="none" stroke="#f7e7d1" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span><div><strong>My Day</strong><p class="muted mt-1 max-w-md">Una herramienta personal para organizarte, registrar tus avances y reducir la saturación.</p></div></div><div class="sm:text-right"><p>Creado por Rocío · <a class="underline font-semibold" href="https://rociogoye.github.io/portfolioros/" target="_blank" rel="noopener noreferrer">Portfolio</a></p><p class="muted mt-1">Tus datos se guardan localmente en este navegador. <span id="year"></span></p></div></div></footer>
    <div id="toastArea" class="fixed bottom-5 right-5 z-50 space-y-2"></div>
  </div>

  <script>
  const labels=['Work','Entreno','Emma','House','Travel','Study'];
  const colors={Work:'#6fa4d8',Entreno:'#78b887',Emma:'#d98da7',House:'#d9b76b',Travel:'#8993d8',Study:'#aa83d1'};
  const quotes=['Empieza con solo cinco minutos.','Avanzar poco también es avanzar.','¿Cuál es el siguiente paso más pequeño?','Tu energía merece cuidado, no presión.','Hoy no tiene que ser perfecto para ser valioso.','Haz espacio para lo que de verdad importa.'];
  const todayKey=new Date().toISOString().slice(0,10);
  const seed={tasks:[{id:1,title:'Revisar brief de Pamedios',tag:'Work',mins:25,done:false,priority:true,subtasks:[{id:11,title:'Abrir notas del cliente',done:false},{id:12,title:'Anotar tres decisiones',done:false}]},{id:2,title:'Paseo tranquilo con Emma',tag:'Emma',mins:30,done:false,priority:false,subtasks:[]},{id:3,title:'Entrenamiento suave',tag:'Entreno',mins:25,done:true,priority:false,subtasks:[]},{id:4,title:'Comprar ingredientes',tag:'House',mins:15,done:false,priority:false,subtasks:[]}],events:[{id:1,time:'09:00',title:'Revisión semanal',tag:'Work',done:false},{id:2,time:'13:30',title:'Paseo y comida con Emma',tag:'Emma',done:false},{id:3,time:'18:00',title:'Entrenamiento',tag:'Entreno',done:true}],highlights:'',tomorrow:'',notes:'',sessions:2,focusSeconds:3000,theme:'light',hideDone:false};
  let state=JSON.parse(localStorage.getItem('myDayState')||'null')||seed;
  state.tasks=(state.tasks||[]).map((t,i)=>({...t,order:Number.isFinite(t.order)?t.order:i,date:t.date||todayKey,time:t.time||'',subtasks:(t.subtasks||[]).map((s,j)=>typeof s==='string'?{id:Date.now()+j,title:s,done:false}:s)}));
  state.highlights=Array.isArray(state.highlights)?state.highlights:(state.highlights?[{id:Date.now(),text:state.highlights,createdAt:todayKey}]:[]);
  state.notes=Array.isArray(state.notes)?state.notes:(state.notes?[{id:Date.now()+1,text:state.notes,createdAt:todayKey}]:[]);
  state.tomorrow=Array.isArray(state.tomorrow)?state.tomorrow:(state.tomorrow?[{id:Date.now()+2,text:state.tomorrow,done:false,createdAt:todayKey}]:[]);
  state.drafts=state.drafts||{highlights:'',notes:'',tomorrow:''};
  state.habits=state.habits||[{id:1,name:'Ejercicio',category:'bienestar',fixed:true,active:true},{id:2,name:'Pasear con Emma',category:'bienestar',fixed:true,active:true}];
  state.habitLogs=state.habitLogs||[]; state.habitLogs=state.habitLogs.map(l=>({...l,date:l.date||todayKey,time:l.time||'',exerciseType:l.exerciseType||'',description:l.description||'',note:l.note||''})); state.meals=state.meals||[]; state.activities=state.activities||[];
  state.events=(state.events||[]).map(e=>({...e,date:e.date||todayKey})); state.selectedAgendaDate=state.selectedAgendaDate||todayKey;
  state.quoteHistory=state.quoteHistory||[]; state.quoteDate=state.quoteDate||''; state.quoteToday=state.quoteToday||'';
  if(state.lastDate!==todayKey){state.lastDate=todayKey;state.sessions=0;state.focusSeconds=0;state.quoteDate='';save()}
  let timer={running:false,seconds:25*60,total:25*60,interval:null,mode:'focus'}; let currentView='today',viewHistory=[];
  function save(){localStorage.setItem('myDayState',JSON.stringify(state))} function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))} function fmt(n){return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`} function dateText(){return new Intl.DateTimeFormat('es-ES',{weekday:'long',day:'numeric',month:'long'}).format(new Date())} function quote(){if(state.quoteDate!==todayKey){let available=quotes.filter(q=>!state.quoteHistory.includes(q));if(!available.length){state.quoteHistory=[];available=quotes.slice()}state.quoteToday=available[Math.floor(Math.random()*available.length)];state.quoteHistory.push(state.quoteToday);state.quoteDate=todayKey;save()}return state.quoteToday}
  const viewSection={today:'today',planning:'plan',tasks:'plan',calendar:'plan',tomorrow:'plan',logging:'log',habits:'log',meals:'log',activities:'log',review:'review',highlights:'review',stats:'review'};
  function showView(view){if(view!==currentView){viewHistory.push(currentView);if(viewHistory.length>20)viewHistory.shift();}currentView=view;document.querySelectorAll('#nav > .nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.section===viewSection[view]));closeNavPanel();render(view)}
  function goBack(){let previous=viewHistory.pop()||'today';currentView=previous;document.querySelectorAll('#nav > .nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.section===viewSection[previous]));closeNavPanel();render(previous)}
  function closeNavPanel(){document.getElementById('navPanel')?.classList.add('hidden')}
  function toggleNavPanel(group){let panel=document.getElementById('navPanel'),content=document.getElementById('navPanelContent');if(!panel)return;if(!panel.classList.contains('hidden')&&panel.dataset.group===group){closeNavPanel();return}let groups={plan:[['tasks','✓ Tareas'],['calendar','◷ Calendario'],['tomorrow','→ Para mañana']],log:[['habits','♡ Hábitos'],['meals','🍽️ Alimentación'],['activities','◷ Actividades']],review:[['highlights','✦ Highlights'],['stats','◒ Resumen']]};let items=group==='menu'?[['tasks','✓ Tareas'],['habits','♡ Hábitos'],['meals','🍽️ Alimentación'],['activities','◷ Actividades'],['calendar','◷ Calendario'],['highlights','✦ Highlights'],['tomorrow','→ Para mañana'],['stats','◒ Resumen']]:groups[group];content.innerHTML=`<div class="grid grid-cols-2 sm:grid-cols-4 gap-2">${items.map(([view,label])=>`<button class="nav-btn text-left rounded-xl px-3 py-3 text-sm font-semibold" onclick="showView('${view}')">${label}</button>`).join('')}</div>`;panel.dataset.group=group;panel.classList.remove('hidden')}
  function toggleMobileNav(){toggleNavPanel('menu')}
  function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';document.documentElement.classList.toggle('dark',state.theme==='dark');document.getElementById('themeBtn').textContent=state.theme==='dark'?'☾':'☼';save()}
  function sectionView(title,description,items,current){return `<div class="space-y-6"><div><p class="muted text-sm">${description}</p><h1 class="text-3xl font-bold mt-1">${title}</h1></div><div class="surface rounded-2xl p-2 flex flex-wrap gap-2" role="tablist">${items.map(([v,label])=>`<button class="nav-btn rounded-xl px-3 py-2 text-sm font-semibold ${v===current?'active':''}" onclick="showView('${v}')">${label}</button>`).join('')}</div>${card(`<p class="muted text-sm">Elige una sección para continuar. Esta vista reemplaza a “Hoy” para que siempre sepas dónde estás.</p>`)}</div>`}
  function planningView(){return sectionView('Planificar','Organiza lo que quieres hacer sin llenar toda la pantalla de menús.',[['tasks','✓ Tareas'],['calendar','◷ Calendario'],['tomorrow','→ Para mañana']],'planning')}
  function loggingView(){return sectionView('Registrar','Anota lo que haces durante el día, de forma sencilla.',[['habits','♡ Hábitos'],['meals','🍽️ Alimentación'],['activities','◷ Actividades']],'logging')}
  function reviewView(){return sectionView('Revisar','Mira tu día con curiosidad, no como una evaluación.',[['highlights','✦ Highlights y notas'],['stats','◒ Resumen semanal']],'review')}
  function breadcrumb(view){let map={tasks:'Planificar / Tareas',calendar:'Planificar / Calendario',tomorrow:'Planificar / Para mañana',habits:'Registrar / Hábitos',meals:'Registrar / Alimentación',activities:'Registrar / Actividades',highlights:'Revisar / Highlights y notas',stats:'Revisar / Resumen semanal'};return map[view]?`<div class="flex flex-wrap items-center gap-3 mb-5"><button class="rounded-xl px-3 py-2 text-sm font-semibold" style="background:var(--soft)" onclick="goBack()">← Volver</button><button class="muted text-sm font-semibold" onclick="showView('today')">Hoy</button><span class="muted text-sm">/ ${map[view]}</span></div>`:''}
  function render(view='today'){document.documentElement.classList.toggle('dark',state.theme==='dark');let content={today:todayView,planning:planningView,logging:loggingView,review:reviewView,tasks:tasksView,habits:habitsView,meals:mealsView,activities:activitiesView,calendar:calendarView,highlights:highlightsView,tomorrow:tomorrowView,stats:statsView}[view]();document.getElementById('main').innerHTML=breadcrumb(view)+content;bindCommon()}
  function bindCommon(){document.querySelectorAll('[data-action="toggle-task"]').forEach(x=>x.onchange=()=>toggleTask(+x.dataset.id));document.querySelectorAll('[data-action="toggle-event"]').forEach(x=>x.onchange=()=>{let e=state.events.find(e=>e.id==x.dataset.id);e.done=x.checked;save();render('calendar')})}
  function score(){let all=state.tasks.length||1;return Math.round(state.tasks.filter(t=>t.done).length/all*100)}
  function card(content,cls=''){return `<section class="surface rounded-3xl p-5 sm:p-6 ${cls}">${content}</section>`}
  function agendaFor(date){let tasks=state.tasks.filter(t=>t.date===date&&t.time).map(t=>({kind:'task',id:t.id,time:t.time,title:t.title,tag:t.tag,done:t.done,mins:t.mins}));let events=state.events.filter(e=>(e.date||todayKey)===date).map(e=>({...e,kind:'event'}));return tasks.concat(events).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'))}
  function weeklyAgenda(){let days=Array.from({length:7},(_,i)=>{let d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+i);let key=d.toISOString().slice(0,10);return {key,label:d.toLocaleDateString('es-ES',{weekday:'short'}),day:d.getDate(),count:agendaFor(key).length}});let selected=state.selectedAgendaDate;return card(`<div class="flex flex-wrap justify-between items-center gap-3 mb-4"><div><h2 class="font-bold text-lg">Agenda de hoy</h2><p class="muted text-sm">Consulta hoy o cualquier día de los próximos siete.</p></div><button class="muted text-sm" onclick="showView('calendar')">Abrir calendario →</button></div><div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-2 mb-5">${days.map(d=>`<button class="rounded-2xl p-3 text-left ${d.key===selected?'ring-2':''}" style="background:${d.key===selected?'var(--soft)':'transparent'};--tw-ring-color:var(--accent2)" onclick="selectAgendaDay('${d.key}')"><span class="muted text-xs capitalize">${d.label}</span><strong class="block text-lg">${d.day}</strong><span class="muted text-xs">${d.count} ${d.count===1?'elemento':'elementos'}</span></button>`).join('')}</div><div class="space-y-2">${agendaFor(selected).map(e=>`<div class="flex items-center gap-3 rounded-2xl border line p-3"><span class="font-bold text-sm w-12">${e.time}</span><span class="w-2 h-8 rounded-full" style="background:${colors[e.tag]||'var(--accent)'}"></span><span class="flex-1 ${e.done?'line-through muted':''}">${e.kind==='task'?'✓':'◷'} ${esc(e.title)} <span class="tag tag-${e.tag} ml-2">${e.kind==='task'?'Tarea':'Evento'}</span></span></div>`).join('')||'<p class="muted py-3">No hay tareas ni eventos planificados para este día.</p>'}</div>`)}
  function selectAgendaDay(date){state.selectedAgendaDate=date;save();render('today')}
  function todayView(){let pending=state.tasks.filter(t=>!t.done),next=pending.find(t=>t.priority)||pending[0];let done=state.tasks.filter(t=>t.done).length;let exercise=state.habitLogs.filter(l=>l.date===todayKey).reduce((s,l)=>s+(Number(l.duration)||0),0);let meals=state.meals.filter(m=>m.date===todayKey).length;let acts=state.activities.filter(a=>a.date===todayKey).length;let week=Array.from({length:7},(_,i)=>{let d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-6+i);let k=d.toISOString().slice(0,10);return {label:d.toLocaleDateString('es-ES',{weekday:'short'}),value:state.tasks.filter(t=>t.date===k&&t.done).length+state.activities.filter(a=>a.date===k).length}});let max=Math.max(1,...week.map(x=>x.value));return `<div class="space-y-7"><div class="flex flex-wrap items-end justify-between gap-4"><div><p class="eyebrow">${dateText()}</p><h1 class="text-3xl sm:text-4xl font-bold mt-2 tracking-tight">Tu día posible.</h1><p class="muted mt-2 text-base">Organiza lo importante y deja espacio para avanzar.</p></div><button class="rounded-2xl px-5 py-3 text-sm font-bold text-white shadow-lg" style="background:linear-gradient(135deg,#7656b8,#9a78d5)" onclick="showView('tasks')">＋ Nueva tarea</button></div>${card(`<div class="dashboard-feature flex flex-col md:flex-row items-start md:items-center justify-between gap-6"><div class="relative z-10 max-w-2xl"><span class="tag" style="background:rgba(255,255,255,.58);color:#5f468e">Tu intención de hoy</span><p class="text-2xl sm:text-3xl font-bold mt-4 leading-tight">“${quote()}”</p><p class="muted mt-3">Un día posible se construye con un paso pequeño.</p></div><div class="relative z-10 rounded-3xl p-5 min-w-[240px] shadow-sm" style="background:rgba(255,255,255,.62)"><p class="muted text-sm font-semibold">Siguiente acción</p><h2 class="text-xl font-bold mt-2">${next?esc(next.title):'Has hecho suficiente por hoy'}</h2><button class="mt-4 rounded-xl px-4 py-2 font-bold" style="background:var(--surface);color:var(--ink)" onclick="${next?`startNow(${next.id})`:''}">▶ Empieza ahora</button></div></div>`)}<div class="grid grid-cols-2 lg:grid-cols-4 gap-4">${card(`<span class="text-2xl" style="color:#7656b8">▣</span><p class="muted text-sm mt-3">Tareas</p><p class="text-3xl font-bold mt-1">${done}/${state.tasks.length}</p><p class="muted text-xs mt-1">${score()}% completado</p>`,'metric-card').replace('metric-card','metric-card" style="--metric-color:#7656b8')} ${card(`<span class="text-2xl" style="color:#d7834c">◷</span><p class="muted text-sm mt-3">Foco</p><p class="text-3xl font-bold mt-1">${state.sessions}</p><p class="muted text-xs mt-1">sesiones realizadas</p>`,'metric-card').replace('metric-card','metric-card" style="--metric-color:#d7834c')} ${card(`<span class="text-2xl" style="color:#4f806d">⌁</span><p class="muted text-sm mt-3">Movimiento</p><p class="text-3xl font-bold mt-1">${exercise} <span class="text-base">min</span></p><p class="muted text-xs mt-1">registrados hoy</p>`,'metric-card').replace('metric-card','metric-card" style="--metric-color:#4f806d')} ${card(`<span class="text-2xl" style="color:#d98da7">＋</span><p class="muted text-sm mt-3">Registros</p><p class="text-3xl font-bold mt-1">${meals+acts}</p><p class="muted text-xs mt-1">comidas y actividades</p>`,'metric-card').replace('metric-card','metric-card" style="--metric-color:#d98da7')}</div><div class="grid lg:grid-cols-[1.25fr_.75fr] gap-6">${weeklyAgenda()}<div class="space-y-6">${card(`<div class="flex justify-between items-center mb-4"><div><p class="eyebrow">Evolución</p><h3 class="font-bold text-lg mt-1">Actividad reciente</h3></div><button class="muted text-sm" onclick="showView('stats')">Ver más →</button></div><div class="dashboard-chart"><div class="h-32 flex items-end gap-2">${week.map(d=>`<div class="flex-1 h-full flex flex-col justify-end items-center gap-1"><div class="chart-bar w-full" style="height:${Math.max(10,Math.round(d.value/max*100))}%" title="${d.value} registros"></div><span class="muted text-[10px] capitalize">${d.label}</span></div>`).join('')}</div><p class="muted text-xs mt-3">Tareas y actividades registradas en los últimos siete días.</p></div>`)}${calendarMini()}${dayTrackerMini()}</div></div></div>`}
  function scoreCard(){let s=score();return card(`<div class="flex items-center gap-5"><div class="progress-ring w-24 h-24 rounded-full grid place-items-center" style="--progress:${s}%"><div class="w-16 h-16 rounded-full grid place-items-center font-bold text-xl" style="background:var(--surface)">${s}%</div></div><div><p class="muted text-sm">Progreso amable</p><h2 class="text-xl font-bold">${state.tasks.filter(t=>t.done).length} de ${state.tasks.length} tareas</h2><p class="muted text-sm mt-1">Cada pequeño avance cuenta.</p></div></div>`)}
  function focusCard(){return card(`<div class="flex justify-between items-center"><div><p class="muted text-sm">Sesiones de concentración</p><h2 class="text-3xl font-bold mt-1">${state.sessions}</h2></div><span class="text-3xl">🍅</span></div><div class="mt-5 flex gap-2 flex-wrap">${[5,15,25,50].map(m=>`<button class="px-3 py-2 rounded-xl text-sm font-bold" style="background:var(--soft)" onclick="openFocus(${m})">${m} min</button>`).join('')}</div>`)}
  function calendarMini(){return card(`<div class="flex justify-between mb-3"><h3 class="font-bold">Hoy en el calendario</h3><button class="muted text-sm" onclick="showView('calendar')">Ver todo →</button></div>${agendaFor(todayKey).slice(0,4).map(e=>`<div class="flex gap-3 items-center py-2"><span class="font-bold text-sm w-12">${e.time}</span><span class="w-2 h-2 rounded-full" style="background:${colors[e.tag]||'var(--accent)'}"></span><span class="text-sm ${e.done?'line-through muted':''}">${e.kind==='task'?'✓ ':'◷ '}${esc(e.title)}</span></div>`).join('')||'<p class="muted text-sm">No hay nada planificado con hora.</p>'}`)}
  function dayTrackerMini(){let exercise=state.habitLogs.find(l=>l.date===todayKey&&l.habitId===1),meals=state.meals.filter(m=>m.date===todayKey).length,acts=state.activities.filter(a=>a.date===todayKey).length;return card(`<div class="flex justify-between mb-3"><h3 class="font-bold">Registro de hoy</h3><button class="muted text-sm" onclick="showView('habits')">Ver registros →</button></div><div class="grid grid-cols-3 gap-2 text-center"><div><span class="text-xl">🏃</span><p class="font-bold text-sm mt-1">${exercise?.duration||0} min</p><p class="muted text-xs">Ejercicio</p></div><div><span class="text-xl">🍽️</span><p class="font-bold text-sm mt-1">${meals}</p><p class="muted text-xs">Comidas</p></div><div><span class="text-xl">◷</span><p class="font-bold text-sm mt-1">${acts}</p><p class="muted text-xs">Actividades</p></div></div><div class="flex flex-wrap gap-2 mt-4"><button class="rounded-xl px-3 py-2 text-xs font-bold" style="background:var(--soft)" onclick="logHabitTime(1)">+ Ejercicio</button><button class="rounded-xl px-3 py-2 text-xs font-bold" style="background:var(--soft)" onclick="logMeal('snack')">+ Comida</button><button class="rounded-xl px-3 py-2 text-xs font-bold" style="background:var(--soft)" onclick="addActivity()">+ Actividad</button></div>`)}
  function sortedTasks(){return state.tasks.slice().sort((a,b)=>Number(b.priority)-Number(a.priority)||Number(a.done)-Number(b.done)||a.order-b.order)}
  function tasksView(){let list=sortedTasks().filter(t=>!state.hideDone||!t.done);return `<div class="space-y-6"><div class="flex flex-wrap items-end justify-between gap-3"><div><p class="muted text-sm">Organiza sin presión</p><h1 class="text-3xl font-bold">TO DO</h1></div><div class="flex gap-2"><button class="rounded-xl px-3 py-2 text-sm surface" onclick="state.hideDone=!state.hideDone;save();render('tasks')">${state.hideDone?'Mostrar':'Ocultar'} completadas</button><button class="rounded-xl px-4 py-2 text-sm font-bold text-white" style="background:var(--accent2)" onclick="addTask()">+ Nueva tarea</button></div></div>${card(`<div class="flex flex-wrap gap-2 mb-5"><span class="muted text-sm mr-2">Ordenadas por:</span><span class="tag" style="background:var(--soft);color:var(--ink)">★ Prioridad</span><span class="tag" style="background:var(--soft);color:var(--ink)">↕ Orden manual</span></div><div class="space-y-3">${list.map(taskItem).join('')||'<p class="muted text-center py-8">No hay tareas visibles. Puedes mostrar las completadas o añadir una nueva.</p>'}</div>`)} </div>`}
  function taskItem(t){let doneSub=t.subtasks.filter(s=>s.done).length;return `<div class="rounded-2xl border line p-4 flex gap-3 items-start"><input class="check mt-1 w-5 h-5" type="checkbox" data-action="toggle-task" data-id="${t.id}" ${t.done?'checked':''} /><div class="flex-1 min-w-0"><div class="flex flex-wrap gap-2 items-center"><span class="tag tag-${t.tag}">${t.tag}</span>${t.priority?'<span class="text-amber-500 text-sm">★ Prioritaria</span>':''}<span class="muted text-sm">◷ ${t.mins} min</span></div><p class="font-semibold mt-2 ${t.done?'line-through muted':''}">${esc(t.title)}</p>${t.subtasks?.length?`<div class="mt-3 space-y-1">${t.subtasks.map(s=>`<label class="flex items-center gap-2 text-sm muted"><input class="check" type="checkbox" ${s.done?'checked':''} onchange="toggleSubtask(${t.id},${s.id})"/> <span class="${s.done?'line-through':''}">${esc(s.title)}</span></label>`).join('')}<p class="text-xs muted">${doneSub}/${t.subtasks.length} subtareas completadas</p></div>`:''}</div><div class="flex gap-1 items-start"><button class="p-2 rounded-lg hover:bg-[var(--soft)]" title="Subir" onclick="moveTask(${t.id},-1)">↑</button><button class="p-2 rounded-lg hover:bg-[var(--soft)]" title="Bajar" onclick="moveTask(${t.id},1)">↓</button><button class="p-2 rounded-lg hover:bg-[var(--soft)]" onclick="editTask(${t.id})">✎</button><button class="p-2 rounded-lg hover:bg-[var(--soft)]" onclick="startNow(${t.id})">▶</button><button class="p-2 rounded-lg hover:bg-[var(--soft)]" onclick="deleteTask(${t.id})">×</button></div></div>`}
  function habitsView(){let logs=state.habitLogs.filter(l=>l.date===todayKey);let weekMinutes=state.habitLogs.filter(l=>{let d=new Date(l.date),now=new Date();return (now-d)/86400000<7&&l.habitId===1}).reduce((s,l)=>s+(Number(l.duration)||0),0);return `<div class="space-y-6"><div class="flex justify-between items-end gap-3"><div><p class="muted text-sm">Registro, no perfección</p><h1 class="text-3xl font-bold">Hábitos</h1><p class="muted mt-2">Hoy: ${new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})} · ${weekMinutes} min de ejercicio en los últimos 7 días</p></div><button class="rounded-xl px-4 py-2 text-sm font-bold text-white" style="background:var(--accent2)" onclick="addHabit()">+ Añadir hábito</button></div>${card(`<div class="space-y-3">${state.habits.filter(h=>h.active).map(h=>{let l=logs.find(x=>x.habitId===h.id);return `<div class="flex items-center gap-3 rounded-2xl border line p-4"><input class="check w-5 h-5" type="checkbox" ${l?.completed?'checked':''} onchange="toggleHabit(${h.id},this.checked)"/><span class="flex-1"><strong>${esc(h.name)}</strong><small class="block muted mt-1">${esc(h.category||'personal')}</small>${l?.description?`<small class="block muted mt-1">${esc(l.exerciseType||'')} · ${esc(l.description)}${l.time?' · '+l.time:''}</small>`:''}</span>${l?.duration?`<span class="muted text-sm">${l.duration} min</span>`:''}<button class="muted" title="Registrar detalles" onclick="logHabitTime(${h.id})">◷</button></div>`}).join('')}</div>`)}${card(`<h2 class="font-bold mb-3">Registros recientes</h2><div class="space-y-2">${state.habitLogs.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8).map(l=>`<div class="flex items-center gap-3 rounded-xl border line p-3 text-sm"><span class="muted w-24">${l.date}</span><span class="flex-1">${esc(l.exerciseType||'Ejercicio')}${l.description?' · '+esc(l.description):''}</span><span class="muted">${l.duration||0} min</span><button class="muted" onclick="editHabitLog(${l.id})">✎</button><button class="muted" onclick="deleteHabitLog(${l.id})">×</button></div>`).join('')||'<p class="muted">Todavía no hay registros detallados.</p>'}</div></div>`)}</div>`}
  function mealsView(){let types=[['desayuno','☕'],['almuerzo','🍲'],['merienda','🍎'],['cena','🌙'],['snack','🥜']];return `<div class="space-y-6"><div><p class="muted text-sm">Registro sencillo de lo que comiste</p><h1 class="text-3xl font-bold">Alimentación</h1></div>${card(`<div class="grid sm:grid-cols-2 gap-3">${types.map(([type,icon])=>{let m=state.meals.find(x=>x.date===todayKey&&x.type===type);return `<div class="rounded-2xl border line p-4"><div class="flex justify-between"><strong>${icon} ${type[0].toUpperCase()+type.slice(1)}</strong><button class="muted" onclick="logMeal('${type}')">${m?'✎':'+'}</button></div><p class="muted text-sm mt-3">${m?esc(m.content):'Sin registrar todavía'}</p>${m?.time?`<small class="muted">${m.time}</small>`:''}</div>`}).join('')}</div>`)}</div>`}
  function activitiesView(){return `<div class="space-y-6"><div class="flex justify-between items-end gap-3"><div><p class="muted text-sm">Lo que realmente hiciste</p><h1 class="text-3xl font-bold">Actividades realizadas</h1></div><button class="rounded-xl px-4 py-2 text-sm font-bold text-white" style="background:var(--accent2)" onclick="addActivity()">+ Registrar actividad</button></div>${card(`<div class="space-y-3">${state.activities.filter(a=>a.date===todayKey).map(a=>`<div class="flex items-center gap-3 rounded-2xl border line p-4"><span class="text-xl">◷</span><div class="flex-1"><strong>${esc(a.title)}</strong><small class="block muted mt-1">${esc(a.category)} · ${a.duration} min${a.time?' · '+a.time:''}</small></div><button class="muted" onclick="editActivity(${a.id})">✎</button><button class="muted" onclick="deleteActivity(${a.id})">×</button></div>`).join('')||'<p class="muted py-4">Todavía no has registrado actividades.</p>'}</div>`)}</div>`}
  function calendarView(){let dated=agendaFor(todayKey),untimed=state.tasks.filter(t=>t.date===todayKey&&!t.time);return `<div class="space-y-6"><div class="flex flex-wrap justify-between items-end gap-3"><div><p class="muted text-sm">${dateText()}</p><h1 class="text-3xl font-bold">Calendario</h1></div><div class="flex gap-2"><button class="rounded-xl px-4 py-2 text-sm font-bold surface" onclick="connectCalendar()">↗ Conectar Google Calendar</button><button class="rounded-xl px-4 py-2 text-sm font-bold text-white" style="background:var(--accent2)" onclick="addEvent()">+ Evento</button></div></div>${card(`<div class="rounded-2xl p-4 mb-5" style="background:var(--soft)"><p class="font-semibold text-sm">Google Calendar no está configurado</p><p class="muted text-sm mt-1">Mostramos eventos locales y tareas planificadas. La conexión externa queda pendiente.</p></div><h3 class="font-bold mb-3">Eventos y tareas de hoy</h3><div class="space-y-2">${dated.map(e=>`<div class="flex items-center gap-3 p-3 rounded-2xl border line"><input class="check w-5 h-5" type="checkbox" ${e.done?'checked':''} onchange="${e.kind==='task'?`toggleTask(${e.id},'calendar')`:`toggleEvent(${e.id},this.checked)`}"/><span class="font-bold w-14">${e.time}</span><span class="w-2 h-8 rounded-full" style="background:${colors[e.tag]||'var(--accent)'}"></span><span class="flex-1 ${e.done?'line-through muted':''}">${e.kind==='task'?'✓ ':'◷ '}${esc(e.title)} <span class="tag tag-${e.tag} ml-2">${e.kind==='task'?'Tarea':'Evento'}</span></span>${e.kind==='event'?`<button class="muted" onclick="editEvent(${e.id})">✎</button><button class="muted" onclick="deleteEvent(${e.id})">×</button>`:'<span class="muted text-xs">Tarea</span>'}</div>`).join('')||'<p class="muted py-4">No hay eventos ni tareas con hora para hoy.</p>'}</div>${untimed.length?`<div class="mt-6"><h3 class="font-bold mb-3">Tareas sin hora</h3><div class="space-y-2">${untimed.map(t=>`<div class="flex items-center gap-3 p-3 rounded-2xl border line"><input class="check w-5 h-5" type="checkbox" ${t.done?'checked':''} onchange="toggleTask(${t.id},'calendar')"/><span class="flex-1 ${t.done?'line-through muted':''}">✓ ${esc(t.title)} <span class="tag tag-${t.tag} ml-2">${t.tag}</span></span><button class="muted" onclick="editTask(${t.id})">✎</button></div>`).join('')}</div></div>`:''}`)} </div>`}
  function entryEditor(title,key,button,placeholder){let list=state[key]||[];return card(`<div class="flex justify-between items-center mb-3"><h2 class="text-lg font-bold">${title}</h2><span class="muted text-xs">${list.length} guardado${list.length===1?'':'s'}</span></div><textarea id="draft-${key}" class="w-full min-h-28 rounded-2xl p-4 border line bg-transparent outline-none focus:ring-2" placeholder="${placeholder}" oninput="state.drafts.${key}=this.value;save()">${esc(state.drafts[key]||'')}</textarea><div class="flex justify-end mt-3"><button class="rounded-xl px-4 py-2 text-sm font-bold text-white" style="background:var(--accent2)" onclick="saveEntry('${key}')">${button}</button></div><div class="space-y-2 mt-5">${list.map(item=>`<div class="rounded-2xl border line p-3 flex gap-3 items-start"><div class="flex-1"><p class="text-sm">${esc(item.text)}</p><p class="muted text-xs mt-1">${esc(item.createdAt||todayKey)}${item.done!==undefined?' · '+(item.done?'Completado':'Pendiente'):''}</p></div>${item.done!==undefined?`<input class="check mt-1" type="checkbox" ${item.done?'checked':''} onchange="toggleTomorrow(${item.id})"/>`:''}<button class="muted" onclick="editEntry('${key}',${item.id})">✎</button><button class="muted" onclick="deleteEntry('${key}',${item.id})">×</button></div>`).join('')||'<p class="muted text-sm py-3">Todavía no hay elementos guardados.</p>'}</div>`)}
  function saveEntry(key){let el=document.getElementById('draft-'+key),text=el?.value.trim();if(!text)return;let item={id:Date.now(),text,createdAt:todayKey};if(key==='tomorrow')item.done=false;state[key].push(item);state.drafts[key]='';save();render(key==='tomorrow'?'tomorrow':'highlights');toast('Guardado correctamente ✨')}
  function editEntry(key,id){openForm('entry',id,key)}function deleteEntry(key,id){state[key]=state[key].filter(x=>x.id!==id);save();render(key==='tomorrow'?'tomorrow':'highlights')}function toggleTomorrow(id){let item=state.tomorrow.find(x=>x.id===id);if(item){item.done=!item.done;save();render('tomorrow')}}
  function highlightsView(){return `<div class="max-w-3xl space-y-6"><div><p class="muted text-sm">Reconocer también es avanzar</p><h1 class="text-3xl font-bold">Highlights del día</h1></div>${entryEditor('Logros, momentos positivos o aprendizajes','highlights','Guardar highlight','Hoy me gustó... / Aprendí que... / Me siento orgullosa de...')}${entryEditor('Notas rápidas','notes','Guardar nota','Ideas sueltas, pendientes o algo que no quieres olvidar...')}</div>`} function tomorrowView(){return `<div class="max-w-3xl space-y-6"><div><p class="muted text-sm">Cierra el día dejando espacio mental</p><h1 class="text-3xl font-bold">Para mañana</h1><p class="muted mt-2">Guarda una nota o convierte el pendiente en una tarea que aparecerá mañana en Tareas y Calendario.</p></div>${card(`<div class="flex flex-wrap justify-between items-center gap-3"><div><h2 class="font-bold">Tarea para mañana</h2><p class="muted text-sm mt-1">Se asignará automáticamente a ${new Date(Date.now()+86400000).toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})}.</p></div><button class="rounded-xl px-4 py-2 text-sm font-bold text-white" style="background:var(--accent2)" onclick="addTomorrowTask()">+ Guardar como tarea</button></div>`)}${entryEditor('Notas, recordatorios e ideas','tomorrow','Guardar nota','Mañana quiero recordar...')}${card('<p class="font-semibold">Un recordatorio amable</p><p class="muted mt-2">No necesitas dejarlo todo resuelto hoy. Es suficiente elegir el próximo paso.</p>')}</div>`}
  function statsView(){let done=state.tasks.filter(t=>t.done).length;let week=Array.from({length:7},(_,i)=>{let d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-6+i);let key=d.toISOString().slice(0,10);return {key,label:d.toLocaleDateString('es-ES',{weekday:'short'}),exercise:state.habitLogs.filter(l=>l.date===key).reduce((s,l)=>s+(Number(l.duration)||0),0),tasks:state.tasks.filter(t=>t.date===key&&t.done).length,activities:state.activities.filter(a=>a.date===key).length}});let hasExercise=week.some(d=>d.exercise>0);let chartWeek=hasExercise?week:week.map((d,i)=>({...d,exercise:[12,24,18,32,20,38,28][i]}));let max=Math.max(1,...chartWeek.map(d=>d.exercise));return `<div class="space-y-6"><div><p class="muted text-sm">Sin rankings, solo señales útiles</p><h1 class="text-3xl font-bold">Historial y evolución</h1><p class="muted mt-2">Mira tus registros para reconocer patrones, no para exigirte más.</p></div>${card(`<div class="flex flex-wrap gap-3"><button class="rounded-xl px-4 py-2 font-bold text-white" style="background:var(--accent2)" onclick="exportData()">↓ Exportar mis datos</button><label class="rounded-xl px-4 py-2 font-bold cursor-pointer" style="background:var(--soft)">↑ Importar datos<input class="sr-only" type="file" accept="application/json,.json" onchange="importData(event)"></label></div><p class="muted text-sm mt-3">Puedes guardar una copia de seguridad local en formato JSON.</p>`)}<div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">${[['✓',done,'Tareas completadas'],['◷',state.sessions,'Sesiones de foco'],['◌',state.events.filter(e=>e.done).length,'Eventos realizados'],['✦',state.highlights.length,'Highlights escritos']].map(x=>card(`<span class="text-2xl" aria-hidden="true">${x[0]}</span><p class="text-3xl font-bold mt-3">${x[1]}</p><p class="muted text-sm mt-1">${x[2]}</p>`)).join('')}</div>${card(`<div class="flex justify-between items-center mb-4"><div><h2 class="font-bold text-lg">Últimos 7 días</h2><p class="muted text-sm">Minutos de ejercicio registrados</p></div><span class="muted text-sm">${hasExercise?week.reduce((s,d)=>s+d.exercise,0):'Ejemplo'} ${hasExercise?'min':''}</span></div><div class="grid grid-cols-7 gap-2 items-end" role="img" aria-label="Gráfico de minutos de ejercicio de los últimos siete días">${chartWeek.map(d=>`<div class="text-center"><div class="h-32 flex items-end justify-center"><div class="w-full max-w-8 rounded-t-xl" style="height:${Math.max(8,Math.round(d.exercise/max*100))}%;background:var(--accent2)" title="${d.exercise} minutos${hasExercise?'':' (ejemplo)'}"></div></div><p class="muted text-xs capitalize mt-2">${d.label}</p><p class="text-xs font-bold">${d.exercise} min</p></div>`).join('')}</div><p class="muted text-xs mt-4">${hasExercise?'Cada registro ayuda a conocer mejor tu ritmo.':'Estos son datos de ejemplo. Cuando registres actividades, el gráfico mostrará tu evolución real.'}</p>`)}${card(`<h2 class="font-bold text-lg">Tu día en una frase</h2><p class="text-xl mt-3">${done?'Has creado movimiento con tus decisiones de hoy.':'No hay una forma correcta de empezar: prueba con cinco minutos.'}</p><p class="muted mt-2">Tiempo de concentración registrado: ${fmt(state.focusSeconds)} · Progreso: ${score()}%</p>`)}</div>`}
  function exportData(){let payload={app:'My Day',version:1,exportedAt:new Date().toISOString(),data:JSON.parse(JSON.stringify(state))};let blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`my-day-backup-${todayKey}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Copia de seguridad descargada ✨')}
  function importData(ev){let file=ev.target.files?.[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let parsed=JSON.parse(reader.result);let incoming=parsed?.data;if(!incoming||!Array.isArray(incoming.tasks)||!Array.isArray(incoming.habits))throw new Error('Formato no válido');if(!confirm('La importación reemplazará los datos actuales. ¿Quieres continuar?'))return;state={...state,...incoming,tasks:incoming.tasks||[],events:incoming.events||[],habits:incoming.habits||[],habitLogs:incoming.habitLogs||[],meals:incoming.meals||[],activities:incoming.activities||[],highlights:incoming.highlights||[],notes:incoming.notes||[],tomorrow:incoming.tomorrow||[],drafts:incoming.drafts||{highlights:'',notes:'',tomorrow:''}};save();showView('stats');toast('Datos importados correctamente ✨')}catch(err){toast('No se pudo importar: revisa que sea un JSON de My Day.')}finally{ev.target.value=''}};reader.readAsText(file)}

  function formShell(title,body,type,id=''){return `<div class="modal-backdrop" id="formModal" role="dialog" aria-modal="true"><form class="surface modal-card rounded-3xl p-6" onsubmit="submitForm(event,'${type}','${id}')"><div class="flex justify-between items-center mb-5"><h2 class="text-xl font-bold">${title}</h2><button type="button" class="muted text-2xl" aria-label="Cerrar" onclick="closeForm()">×</button></div>${body}<div class="flex justify-end gap-2 mt-6"><button type="button" class="rounded-xl px-4 py-2 font-semibold" style="background:var(--soft)" onclick="closeForm()">Cancelar</button><button class="rounded-xl px-4 py-2 font-bold text-white" style="background:var(--accent2)">Guardar</button></div></form></div>`}
  function selectField(label,name,value,options){return `<label class="block text-sm font-semibold mb-3">${label}<select class="field mt-1" name="${name}">${options.map(o=>`<option value="${o}" ${o===value?'selected':''}>${o}</option>`).join('')}</select></label>`}
  function openForm(type,id='',extra=''){let obj=id?(type==='task'?state.tasks.find(x=>x.id==id):type==='event'?state.events.find(x=>x.id==id):type==='activity'?state.activities.find(x=>x.id==id):type==='meal'?state.meals.find(x=>x.id==id):type==='habitLog'?state.habitLogs.find(x=>x.habitId==id&&x.date===todayKey):type==='habitLogEdit'?state.habitLogs.find(x=>x.id==id):type==='entry'?state[extra]?.find(x=>x.id==id):null):null;let title='',body='';if(type==='task'){obj=obj||{};title=id?'Editar tarea':extra==='tomorrow'?'Nueva tarea para mañana':'Nueva tarea';let defaultDate=extra==='tomorrow'?new Date(Date.now()+86400000).toISOString().slice(0,10):todayKey;body=`<label class="block text-sm font-semibold mb-3">Título<input class="field mt-1" name="title" required value="${esc(obj.title||'')}" placeholder="Ej. Preparar entrevista"></label>${selectField('Etiqueta','tag',obj.tag||'Work',labels)}<div class="grid grid-cols-2 gap-3"><label class="block text-sm font-semibold">Duración (min)<input class="field mt-1" name="mins" type="number" min="1" value="${obj.mins||25}"></label><label class="block text-sm font-semibold">Fecha<input class="field mt-1" name="date" type="date" value="${obj.date||defaultDate}"></label></div><label class="block text-sm font-semibold mt-3">Hora opcional<input class="field mt-1" name="time" type="time" value="${obj.time||''}"></label><label class="flex items-center gap-2 mt-4 text-sm"><input type="checkbox" name="priority" ${obj.priority?'checked':''}> Marcar como prioritaria</label><label class="block text-sm font-semibold mt-3">Subtareas, una por línea<textarea class="field mt-1 min-h-24" name="subtasks" placeholder="Abrir documento\nEscribir tres ideas">${esc((obj.subtasks||[]).map(s=>s.title).join('\n'))}</textarea></label>`}else if(type==='event'){obj=obj||{};title=id?'Editar evento':'Nuevo evento';body=`<label class="block text-sm font-semibold mb-3">Nombre<input class="field mt-1" name="title" required value="${esc(obj.title||'')}" placeholder="Ej. Reunión"></label><div class="grid grid-cols-2 gap-3"><label class="block text-sm font-semibold">Fecha<input class="field mt-1" name="date" type="date" value="${obj.date||todayKey}"></label><label class="block text-sm font-semibold">Hora<input class="field mt-1" name="time" type="time" required value="${obj.time||'09:00'}"></label></div>${selectField('Etiqueta','tag',obj.tag||'Work',labels)}`}else if(type==='habit'){obj=obj||{};title='Nuevo hábito';body=`<div class="rounded-2xl p-3 mb-4 text-sm" style="background:var(--soft)">Aquí defines el hábito. Después podrás registrar cada día qué hiciste, cuánto duró y a qué hora.</div><label class="block text-sm font-semibold mb-3">Nombre<input class="field mt-1" name="name" required value="${esc(obj.name||'')}" placeholder="Ej. Ejercicio"></label><label class="block text-sm font-semibold mb-3">Categoría<input class="field mt-1" name="category" value="${esc(obj.category||'bienestar')}" placeholder="Ej. hobby, bienestar, estudio"></label>${selectField('Cómo quieres registrarlo','tracking',obj.tracking||'check',['check','minutos','texto'])}<div class="grid grid-cols-2 gap-3"><label class="block text-sm font-semibold">Objetivo opcional<input class="field mt-1" name="target" type="number" min="0" value="${obj.target||''}" placeholder="Ej. 30"></label><label class="block text-sm font-semibold">Hora habitual<input class="field mt-1" name="habitTime" type="time" value="${obj.habitTime||''}"></label></div><label class="block text-sm font-semibold mt-3">Nota opcional<textarea class="field mt-1 min-h-20" name="habitNote" placeholder="Ej. Registrar después de entrenar">${esc(obj.habitNote||'')}</textarea></label>`}else if(type==='habitLog'||type==='habitLogEdit'){obj=obj||{};title=type==='habitLogEdit'?'Editar registro de ejercicio':'Registrar ejercicio';body=`<div class="grid grid-cols-2 gap-3"><label class="block text-sm font-semibold">Fecha<input class="field mt-1" name="date" type="date" value="${obj.date||todayKey}"></label><label class="block text-sm font-semibold">Hora opcional<input class="field mt-1" name="time" type="time" value="${obj.time||''}"></label></div><label class="block text-sm font-semibold mt-3">Tipo de ejercicio<select class="field mt-1" name="exerciseType"><option>Caminar</option><option>Correr</option><option>Gimnasio</option><option>Yoga</option><option>Bicicleta</option><option>Entrenamiento en casa</option><option>Otro</option></select></label><label class="block text-sm font-semibold mt-3">¿Qué hiciste?<input class="field mt-1" name="description" value="${esc(obj.description||'')}" placeholder="Ej. Caminata por el parque"></label><label class="block text-sm font-semibold mt-3">Duración (minutos)<input class="field mt-1" name="duration" type="number" min="0" value="${obj.duration||0}"></label><label class="block text-sm font-semibold mt-3">Nota opcional<input class="field mt-1" name="note" value="${esc(obj.note||'')}" placeholder="Algo que quieras recordar"></label>`}else if(type==='meal'){obj=obj||{};title=obj.id?'Editar comida':'Registrar comida';body=`${selectField('Tipo','mealType',extra||obj.type||'desayuno',['desayuno','almuerzo','merienda','cena','snack'])}<label class="block text-sm font-semibold">¿Qué comiste?<textarea class="field mt-1 min-h-24" name="content" required placeholder="Escribe brevemente lo que comiste">${esc(obj.content||'')}</textarea></label><label class="block text-sm font-semibold mt-3">Hora opcional<input class="field mt-1" name="time" type="time" value="${obj.time||''}"></label>`}else if(type==='activity'){obj=obj||{};title=obj.id?'Editar actividad':'Registrar actividad';body=`<label class="block text-sm font-semibold mb-3">Actividad<input class="field mt-1" name="title" required value="${esc(obj.title||'')}" placeholder="Ej. Estudié IA"></label>${selectField('Categoría','category',obj.category||'trabajo',['trabajo','estudio','entrevista','proyecto','casa','Emma','ocio','otra'])}<div class="grid grid-cols-2 gap-3"><label class="block text-sm font-semibold">Duración (min)<input class="field mt-1" name="duration" type="number" min="1" value="${obj.duration||30}"></label><label class="block text-sm font-semibold">Hora<input class="field mt-1" name="time" type="time" value="${obj.time||''}"></label></div>`}else if(type==='entry'){obj=obj||{};title='Editar registro';body=`<label class="block text-sm font-semibold">Contenido<textarea class="field mt-1 min-h-32" name="text" required>${esc(obj.text||'')}</textarea></label><input type="hidden" name="entryKey" value="${extra}">`}lastFocusedElement=document.activeElement;document.getElementById('toastArea').innerHTML=formShell(title,body,type,id);setTimeout(()=>document.querySelector('#formModal input, #formModal textarea, #formModal select, #formModal button')?.focus(),0)}
  function submitForm(ev,type,id){ev.preventDefault();let d=Object.fromEntries(new FormData(ev.target).entries());let formExtra=ev.target.querySelector('[name="date"]')?.value;if(type==='task'){let isTomorrow=ev.target.querySelector('[name="date"]')?.value&&ev.target.querySelector('[name="date"]')?.value!==todayKey;let t=id?state.tasks.find(x=>x.id==id):{id:Date.now(),order:state.tasks.length,done:false,subtasks:[]};Object.assign(t,{title:d.title.trim(),tag:d.tag,mins:Number(d.mins)||25,date:d.date||todayKey,time:d.time||'',priority:d.priority==='on'});t.subtasks=(d.subtasks||'').split('\n').map(x=>x.trim()).filter(Boolean).map((x,i)=>({id:t.subtasks[i]?.id||Date.now()+i,title:x,done:t.subtasks[i]?.done||false}));if(!id)state.tasks.push(t);save();closeForm();render(isTomorrow?'tomorrow':'tasks')}else if(type==='event'){let e=id?state.events.find(x=>x.id==id):{id:Date.now(),done:false};Object.assign(e,{title:d.title.trim(),date:d.date||todayKey,time:d.time,tag:d.tag});if(!id)state.events.push(e);save();closeForm();render('calendar')}else if(type==='habit'){state.habits.push({id:Date.now(),name:d.name.trim(),category:d.category||'personal',tracking:d.tracking||'check',target:Number(d.target)||0,habitTime:d.habitTime||'',habitNote:d.habitNote||'',fixed:false,active:true});save();closeForm();render('habits')}else if(type==='habitLog'||type==='habitLogEdit'){let l=type==='habitLogEdit'?state.habitLogs.find(x=>x.id==id):state.habitLogs.find(x=>x.habitId==id&&x.date===(d.date||todayKey));if(!l){l={id:Date.now(),habitId:Number(id),date:d.date||todayKey,completed:true,duration:0};state.habitLogs.push(l)}Object.assign(l,{completed:true,date:d.date||todayKey,time:d.time||'',exerciseType:d.exerciseType||'',description:d.description||'',duration:Number(d.duration)||0,note:d.note||''});save();closeForm();render('habits')}else if(type==='meal'){let m=id?state.meals.find(x=>x.id==id):null;if(m)Object.assign(m,{type:d.mealType,content:d.content.trim(),time:d.time||''});else state.meals.push({id:Date.now(),date:todayKey,type:d.mealType,content:d.content.trim(),time:d.time||''});save();closeForm();render('meals')}else if(type==='activity'){let a=id?state.activities.find(x=>x.id==id):{id:Date.now(),date:todayKey};Object.assign(a,{title:d.title.trim(),category:d.category,duration:Number(d.duration)||30,time:d.time||''});if(!id)state.activities.push(a);save();closeForm();render('activities')}else if(type==='entry'){let key=d.entryKey,item=state[key].find(x=>x.id==id);if(item&&d.text.trim()){item.text=d.text.trim();save();closeForm();render(key==='tomorrow'?'tomorrow':'highlights')}}
  }

  function smallStep(title){let clean=title.replace(/^(revisar|preparar|hacer|organizar|terminar|completar|trabajar en)\s+/i,'');return `Abrir lo necesario y dedicar cinco minutos a ${clean.charAt(0).toLowerCase()+clean.slice(1)}`}
  function openFocus(mins=25,step=''){timer.seconds=timer.total=mins*60;timer.mode='focus';timer.step=step;focusModal()}function startFocus(id){let t=state.tasks.find(t=>t.id===id);openFocus(t?.mins||25)}function startNow(id){let t=state.tasks.find(t=>t.id===id);if(t)openFocus(Math.min(t.mins||25,5),smallStep(t.title))}function focusModal(){document.getElementById('toastArea').innerHTML=`<div id="focus" class="surface rounded-3xl p-6 w-[min(92vw,380px)]"><div class="flex justify-between"><div><p class="muted text-sm">${timer.mode==='focus'?'Sesión de concentración':'Pausa programada'}</p><h2 class="text-xl font-bold mt-1">${timer.mode==='focus'?'Un paso cada vez':'Respira y recarga'}</h2></div><button class="muted text-2xl" onclick="closeFocus()">×</button></div>${timer.step?`<div class="rounded-2xl p-3 mt-4 text-sm" style="background:var(--soft)"><strong>Primer paso:</strong> ${esc(timer.step)}</div>`:''}<div class="text-6xl font-bold text-center py-8 tracking-wider" id="timerText">${fmt(timer.seconds)}</div><p class="muted text-center text-sm mb-5" id="timerMsg">${timer.mode==='focus'?'Empieza con solo cinco minutos.':'Te has ganado esta pausa.'}</p><div class="flex gap-2"><button class="flex-1 rounded-xl py-3 font-bold text-white" style="background:var(--accent2)" onclick="toggleTimer()" id="timerBtn">▶ Empezar</button><button class="rounded-xl px-4 py-3 font-bold" style="background:var(--soft)" onclick="resetTimer()">↺</button></div></div>`}
  function toggleTimer(){if(timer.running){clearInterval(timer.interval);timer.running=false;document.getElementById('timerBtn').textContent='▶ Continuar';return}timer.running=true;document.getElementById('timerBtn').textContent='Ⅱ Pausar';timer.interval=setInterval(()=>{timer.seconds--;if(timer.mode==='focus')state.focusSeconds++;let el=document.getElementById('timerText');if(el)el.textContent=fmt(timer.seconds);if(timer.seconds<=0){clearInterval(timer.interval);timer.running=false;if(timer.mode==='focus'){state.sessions++;save();timer.mode='break';timer.seconds=timer.total=5*60;focusModal();toast('Sesión completada. Date una pausa, te la has ganado 🌿')}else closeFocus()}},1000)}function resetTimer(){clearInterval(timer.interval);timer.running=false;timer.seconds=timer.total;focusModal()}function closeFocus(){clearInterval(timer.interval);timer.running=false;document.getElementById('toastArea').innerHTML=''}function toast(msg){let d=document.createElement('div');d.className='toast surface rounded-2xl px-4 py-3 text-sm font-semibold';d.textContent=msg;document.getElementById('toastArea').appendChild(d);setTimeout(()=>d.remove(),3500)}
