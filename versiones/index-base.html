<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f4ee" />
  <title>My Day · Tu día, a tu ritmo</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23e9a46f'/%3E%3Cpath d='M32 15v34M15 32h34' stroke='white' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Inter','ui-sans-serif','system-ui']}}}}</script>
  <style>
    :root{--bg:#f7f4ee;--surface:#fffdf9;--ink:#26322e;--muted:#718078;--line:#e9e3d9;--accent:#e9a46f;--accent2:#719b89;--soft:#f5e9dc;--shadow:0 14px 40px rgba(58,48,35,.08)}
    .dark{--bg:#18211f;--surface:#22302b;--ink:#f4f1e9;--muted:#a9b8af;--line:#3a4943;--soft:#34433c;--shadow:0 14px 40px rgba(0,0,0,.22)}
    *{box-sizing:border-box}body{background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui;transition:background .25s,color .25s}.surface{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}.muted{color:var(--muted)}.line{border-color:var(--line)}
    button,input,textarea,select{font:inherit}button{cursor:pointer}.nav-btn{color:var(--muted);transition:.2s}.nav-btn.active,.nav-btn:hover{background:var(--soft);color:var(--ink)}.tag{font-size:.72rem;font-weight:700;padding:.28rem .55rem;border-radius:999px;display:inline-flex;align-items:center;gap:.25rem}.tag-Work{background:#e4effc;color:#3770aa}.tag-Entreno{background:#e5f4e8;color:#39754a}.tag-Emma{background:#f9e5ec;color:#a55370}.tag-House{background:#f5ead2;color:#96722f}.tag-Travel{background:#e5e8fb;color:#5964a8}.tag-Study{background:#eee4fb;color:#7a55a0}.progress-ring{background:conic-gradient(var(--accent) var(--progress),var(--soft) 0)}.check{accent-color:var(--accent2)}.toast{animation:slide .25s ease}@keyframes slide{from{transform:translateY(15px);opacity:0}to{transform:none;opacity:1}}
  </style>
</head>
<body>
  <div id="app" class="min-h-screen">
    <header class="sticky top-0 z-20 border-b line" style="background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(16px)">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-4">
        <button class="flex items-center gap-3" onclick="showView('today')"><span class="w-10 h-10 rounded-2xl grid place-items-center text-xl" style="background:var(--accent)">✦</span><span><strong class="text-lg tracking-tight">My Day</strong><small class="block muted text-xs">a tu ritmo</small></span></button>
        <div class="flex items-center gap-2"><button id="themeBtn" class="w-10 h-10 rounded-xl surface" onclick="toggleTheme()" aria-label="Cambiar tema">☼</button><button class="w-10 h-10 rounded-xl surface md:hidden" onclick="toggleMobileNav()">☰</button></div>
      </div>
      <nav id="nav" class="max-w-7xl mx-auto px-4 sm:px-6 pb-3 hidden md:flex gap-1 overflow-x-auto">
        <button class="nav-btn active rounded-xl px-4 py-2 text-sm font-semibold" data-view="today" onclick="showView('today')">☀️ Hoy</button><button class="nav-btn rounded-xl px-4 py-2 text-sm font-semibold" data-view="tasks" onclick="showView('tasks')">✓ Tareas</button><button class="nav-btn rounded-xl px-4 py-2 text-sm font-semibold" data-view="calendar" onclick="showView('calendar')">◷ Calendario</button><button class="nav-btn rounded-xl px-4 py-2 text-sm font-semibold" data-view="highlights" onclick="showView('highlights')">✦ Highlights</button><button class="nav-btn rounded-xl px-4 py-2 text-sm font-semibold" data-view="tomorrow" onclick="showView('tomorrow')">→ Para mañana</button><button class="nav-btn rounded-xl px-4 py-2 text-sm font-semibold" data-view="stats" onclick="showView('stats')">◒ Estadísticas</button>
      </nav>
    </header>
    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8" id="main"></main>
    <div id="toastArea" class="fixed bottom-5 right-5 z-50 space-y-2"></div>
  </div>

  <script>
  const labels=['Work','Entreno','Emma','House','Travel','Study'];
  const colors={Work:'#6fa4d8',Entreno:'#78b887',Emma:'#d98da7',House:'#d9b76b',Travel:'#8993d8',Study:'#aa83d1'};
  const quotes=['Empieza con solo cinco minutos.','Avanzar poco también es avanzar.','¿Cuál es el siguiente paso más pequeño?','Tu energía merece cuidado, no presión.','Hoy no tiene que ser perfecto para ser valioso.','Haz espacio para lo que de verdad importa.'];
  const todayKey=new Date().toISOString().slice(0,10);
  const seed={tasks:[{id:1,title:'Revisar brief de Pamedios',tag:'Work',mins:25,done:false,priority:true,subtasks:['Abrir notas del cliente','Anotar tres decisiones']},{id:2,title:'Paseo tranquilo con Emma',tag:'Emma',mins:30,done:false,priority:false,subtasks:[]},{id:3,title:'Entrenamiento suave',tag:'Entreno',mins:25,done:true,priority:false,subtasks:[]},{id:4,title:'Comprar ingredientes',tag:'House',mins:15,done:false,priority:false,subtasks:[]}],events:[{id:1,time:'09:00',title:'Revisión semanal',tag:'Work',done:false},{id:2,time:'13:30',title:'Paseo y comida con Emma',tag:'Emma',done:false},{id:3,time:'18:00',title:'Entrenamiento',tag:'Entreno',done:true}],highlights:'',tomorrow:'',notes:'',sessions:2,focusSeconds:3000,theme:'light',hideDone:false};
  let state=JSON.parse(localStorage.getItem('myDayState')||'null')||seed; if(state.lastDate!==todayKey){state.lastDate=todayKey;state.sessions=0;state.focusSeconds=0;save()}
  let timer={running:false,seconds:25*60,total:25*60,interval:null,mode:'focus'};
  function save(){localStorage.setItem('myDayState',JSON.stringify(state))} function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))} function fmt(n){return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`} function dateText(){return new Intl.DateTimeFormat('es-ES',{weekday:'long',day:'numeric',month:'long'}).format(new Date())} function quote(){return quotes[new Date().getDate()%quotes.length]}
  function showView(view){document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===view));document.getElementById('nav').classList.remove('flex');document.getElementById('nav').classList.add('hidden');if(innerWidth>=768){document.getElementById('nav').classList.remove('hidden');document.getElementById('nav').classList.add('flex')} render(view)} function toggleMobileNav(){let n=document.getElementById('nav');n.classList.toggle('hidden');n.classList.toggle('flex')}
  function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';document.documentElement.classList.toggle('dark',state.theme==='dark');document.getElementById('themeBtn').textContent=state.theme==='dark'?'☾':'☼';save()}
  function render(view='today'){document.documentElement.classList.toggle('dark',state.theme==='dark');document.getElementById('main').innerHTML={today:todayView,tasks:tasksView,calendar:calendarView,highlights:highlightsView,tomorrow:tomorrowView,stats:statsView}[view]();bindCommon()}
  function bindCommon(){document.querySelectorAll('[data-action="toggle-task"]').forEach(x=>x.onchange=()=>toggleTask(+x.dataset.id));document.querySelectorAll('[data-action="toggle-event"]').forEach(x=>x.onchange=()=>{let e=state.events.find(e=>e.id==x.dataset.id);e.done=x.checked;save();render('calendar')})}
  function score(){let all=state.tasks.length||1;return Math.round(state.tasks.filter(t=>t.done).length/all*100)}
  function card(content,cls=''){return `<section class="surface rounded-3xl p-5 sm:p-6 ${cls}">${content}</section>`}
  function todayView(){let pending=state.tasks.filter(t=>!t.done),next=pending.find(t=>t.priority)||pending[0];return `<div class="grid lg:grid-cols-[1.35fr_.65fr] gap-6"><div class="space-y-6"><div class="flex flex-wrap items-end justify-between gap-3"><div><p class="muted text-sm capitalize">${dateText()}</p><h1 class="text-3xl sm:text-4xl font-bold mt-1 tracking-tight">Un día posible, paso a paso.</h1></div><button class="rounded-2xl px-4 py-3 text-sm font-bold text-white" style="background:var(--accent2)" onclick="showView('tasks')">+ Añadir tarea</button></div>${card(`<div class="flex flex-col sm:flex-row gap-5 items-stretch"><div class="flex-1"><span class="tag" style="background:var(--soft);color:var(--ink)">☀️ Tu frase de hoy</span><p class="text-2xl font-semibold mt-4 leading-tight">“${quote()}”</p><p class="muted mt-3 text-sm">Una intención amable para empezar sin exigirte de más.</p></div><img class="sm:w-44 h-36 object-cover rounded-2xl" src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=600&q=80" alt="Paisaje inspirador" onerror="this.style.display='none'" /></div>`)}${card(`<div class="flex items-center justify-between"><div><p class="muted text-sm">Siguiente acción</p><h2 class="text-xl font-bold mt-1">${next?esc(next.title):'Has hecho suficiente por hoy ✨'}</h2><p class="muted text-sm mt-1">${next?'Solo necesitas empezar con '+next.mins+' minutos.':'Tómate un momento para reconocerlo.'}</p></div><button class="rounded-2xl px-4 py-3 font-bold" style="background:var(--soft)" onclick="${next?`startFocus(${next.id})`:''}">▶ Empieza ahora</button></div>`)} </div><div class="space-y-6">${scoreCard()}${focusCard()}${calendarMini()}</div></div>`}
  function scoreCard(){let s=score();return card(`<div class="flex items-center gap-5"><div class="progress-ring w-24 h-24 rounded-full grid place-items-center" style="--progress:${s}%"><div class="w-16 h-16 rounded-full grid place-items-center font-bold text-xl" style="background:var(--surface)">${s}%</div></div><div><p class="muted text-sm">Progreso amable</p><h2 class="text-xl font-bold">${state.tasks.filter(t=>t.done).length} de ${state.tasks.length} tareas</h2><p class="muted text-sm mt-1">Cada pequeño avance cuenta.</p></div></div>`)}
  function focusCard(){return card(`<div class="flex justify-between items-center"><div><p class="muted text-sm">Sesiones de concentración</p><h2 class="text-3xl font-bold mt-1">${state.sessions}</h2></div><span class="text-3xl">🍅</span></div><div class="mt-5 flex gap-2 flex-wrap">${[5,15,25,50].map(m=>`<button class="px-3 py-2 rounded-xl text-sm font-bold" style="background:var(--soft)" onclick="openFocus(${m})">${m} min</button>`).join('')}</div>`)}
  function calendarMini(){return card(`<div class="flex justify-between mb-3"><h3 class="font-bold">Hoy en el calendario</h3><button class="muted text-sm" onclick="showView('calendar')">Ver todo →</button></div>${state.events.slice(0,3).map(e=>`<div class="flex gap-3 items-center py-2"><span class="font-bold text-sm w-12">${e.time}</span><span class="w-2 h-2 rounded-full" style="background:${colors[e.tag]}"></span><span class="text-sm ${e.done?'line-through muted':''}">${esc(e.title)}</span></div>`).join('')}`)}
  function tasksView(){let list=state.tasks.filter(t=>!state.hideDone||!t.done).sort((a,b)=>Number(b.priority)-Number(a.priority)||Number(a.done)-Number(b.done));return `<div class="space-y-6"><div class="flex flex-wrap items-end justify-between gap-3"><div><p class="muted text-sm">Organiza sin presión</p><h1 class="text-3xl font-bold">TO DO</h1></div><div class="flex gap-2"><button class="rounded-xl px-3 py-2 text-sm surface" onclick="state.hideDone=!state.hideDone;save();render('tasks')">${state.hideDone?'Mostrar':'Ocultar'} completadas</button><button class="rounded-xl px-4 py-2 text-sm font-bold text-white" style="background:var(--accent2)" onclick="addTask()">+ Nueva tarea</button></div></div>${card(`<div class="flex flex-wrap gap-2 mb-5"><span class="muted text-sm mr-2">Ordenadas por:</span><span class="tag" style="background:var(--soft);color:var(--ink)">★ Prioridad</span><span class="tag" style="background:var(--soft);color:var(--ink)">○ Pendientes</span></div><div class="space-y-3">${list.map(taskItem).join('')||'<p class="muted text-center py-8">No hay tareas visibles. Puedes mostrar las completadas o añadir una nueva.</p>'}</div>`)} </div>`}
  function taskItem(t){return `<div class="rounded-2xl border line p-4 flex gap-3 items-start"><input class="check mt-1 w-5 h-5" type="checkbox" data-action="toggle-task" data-id="${t.id}" ${t.done?'checked':''} /><div class="flex-1 min-w-0"><div class="flex flex-wrap gap-2 items-center"><span class="tag tag-${t.tag}">${t.tag}</span>${t.priority?'<span class="text-amber-500 text-sm">★ Prioritaria</span>':''}<span class="muted text-sm">◷ ${t.mins} min</span></div><p class="font-semibold mt-2 ${t.done?'line-through muted':''}">${esc(t.title)}</p>${t.subtasks?.length?`<p class="muted text-xs mt-2">↳ ${t.subtasks.length} subtareas</p>`:''}</div><div class="flex gap-1"><button class="p-2 rounded-lg hover:bg-[var(--soft)]" onclick="editTask(${t.id})">✎</button><button class="p-2 rounded-lg hover:bg-[var(--soft)]" onclick="startFocus(${t.id})">▶</button><button class="p-2 rounded-lg hover:bg-[var(--soft)]" onclick="deleteTask(${t.id})">×</button></div></div>`}
  function calendarView(){return `<div class="space-y-6"><div class="flex flex-wrap justify-between items-end gap-3"><div><p class="muted text-sm">${dateText()}</p><h1 class="text-3xl font-bold">Calendario</h1></div><div class="flex gap-2"><button class="rounded-xl px-4 py-2 text-sm font-bold surface" onclick="connectCalendar()">↗ Conectar Google Calendar</button><button class="rounded-xl px-4 py-2 text-sm font-bold text-white" style="background:var(--accent2)" onclick="addEvent()">+ Evento</button></div></div>${card(`<div class="rounded-2xl p-4 mb-5" style="background:var(--soft)"><p class="font-semibold text-sm">Google Calendar no está configurado</p><p class="muted text-sm mt-1">Mostramos tus eventos locales de ejemplo. Tus datos se guardan solo en este dispositivo.</p></div><div class="space-y-2">${state.events.sort((a,b)=>a.time.localeCompare(b.time)).map(e=>`<div class="flex items-center gap-3 p-3 rounded-2xl border line"><input class="check w-5 h-5" type="checkbox" data-action="toggle-event" data-id="${e.id}" ${e.done?'checked':''}/><span class="font-bold w-14">${e.time}</span><span class="w-2 h-8 rounded-full" style="background:${colors[e.tag]}"></span><span class="flex-1 ${e.done?'line-through muted':''}">${esc(e.title)} <span class="tag tag-${e.tag} ml-2">${e.tag}</span></span><button class="muted" onclick="deleteEvent(${e.id})">×</button></div>`).join('')}</div>`)} </div>`}
  function notesCard(title,key,placeholder){return card(`<div class="flex justify-between items-center mb-3"><h2 class="text-lg font-bold">${title}</h2><span class="muted text-xs">Se guarda automáticamente</span></div><textarea class="w-full min-h-40 rounded-2xl p-4 border line bg-transparent outline-none focus:ring-2" placeholder="${placeholder}" oninput="state.${key}=this.value;save()">${esc(state[key])}</textarea>`)}
  function highlightsView(){return `<div class="max-w-3xl space-y-6"><div><p class="muted text-sm">Reconocer también es avanzar</p><h1 class="text-3xl font-bold">Highlights del día</h1></div>${notesCard('Logros, momentos positivos o aprendizajes','highlights','Hoy me gustó... / Aprendí que... / Me siento orgullosa de...')}${notesCard('Notas rápidas','notes','Ideas sueltas, pendientes o algo que no quieres olvidar...')}</div>`} function tomorrowView(){return `<div class="max-w-3xl space-y-6"><div><p class="muted text-sm">Cierra el día dejando espacio mental</p><h1 class="text-3xl font-bold">Para mañana</h1></div>${notesCard('Tareas y prioridades','tomorrow','Mañana quiero empezar por...')}${card('<p class="font-semibold">Un recordatorio amable</p><p class="muted mt-2">No necesitas dejarlo todo resuelto hoy. Es suficiente elegir el próximo paso.</p>')}</div>`}
  function statsView(){let done=state.tasks.filter(t=>t.done).length;return `<div class="space-y-6"><div><p class="muted text-sm">Sin rankings, solo señales útiles</p><h1 class="text-3xl font-bold">Resumen diario</h1></div><div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">${[['✓',done,'Tareas completadas'],['🍅',state.sessions,'Sesiones de foco'],['◷',state.events.filter(e=>e.done).length,'Eventos realizados'],['✦',state.highlights?1:0,'Highlights escritos']].map(x=>card(`<span class="text-2xl">${x[0]}</span><p class="text-3xl font-bold mt-3">${x[1]}</p><p class="muted text-sm mt-1">${x[2]}</p>`)).join('')}</div>${card(`<h2 class="font-bold text-lg">Tu día en una frase</h2><p class="text-xl mt-3">${done?'Has creado movimiento con tus decisiones de hoy.':'No hay una forma correcta de empezar: prueba con cinco minutos.'}</p><p class="muted mt-2">Tiempo de concentración registrado: ${fmt(state.focusSeconds)} · Progreso: ${score()}%</p>`)}</div>`}
  function toggleTask(id){let t=state.tasks.find(t=>t.id===id);t.done=!t.done;save();if(t.done)toast('Tarea completada. Qué bien cuidar tu ritmo ✨');render('tasks')}
  function addTask(){let title=prompt('¿Cuál es la tarea?');if(!title)return;let tag=prompt('Etiqueta: Work, Entreno, Emma, House, Travel o Study','Work');let mins=Number(prompt('Duración estimada en minutos','25'))||25;state.tasks.push({id:Date.now(),title,tag:labels.includes(tag)?tag:'Work',mins,done:false,priority:false,subtasks:[]});save();render('tasks')}
  function editTask(id){let t=state.tasks.find(t=>t.id===id);let title=prompt('Editar tarea',t.title);if(title!==null&&title.trim()){t.title=title.trim();t.priority=confirm('¿Marcar como prioritaria?');let sub=prompt('Subtareas opcionales, separadas por coma',t.subtasks.join(', '));if(sub!==null)t.subtasks=sub.split(',').map(s=>s.trim()).filter(Boolean);save();render('tasks')}} function deleteTask(id){if(confirm('¿Eliminar esta tarea?')){state.tasks=state.tasks.filter(t=>t.id!==id);save();render('tasks')}}
  function addEvent(){let title=prompt('Nombre del evento');if(!title)return;let time=prompt('Hora (HH:MM)','10:00')||'10:00';let tag=prompt('Etiqueta','Work');state.events.push({id:Date.now(),title,time,tag:labels.includes(tag)?tag:'Work',done:false});save();render('calendar')}function deleteEvent(id){state.events=state.events.filter(e=>e.id!==id);save();render('calendar')}function connectCalendar(){alert('Conexión pendiente: en una versión real, registra una app OAuth en Google Cloud, añade el Client ID en este archivo o en un backend seguro, solicita el scope de Calendar y reemplaza esta acción por el flujo Google Identity Services. Nunca pongas un client secret en este HTML.')}
  function openFocus(mins=25){timer.seconds=timer.total=mins*60;timer.mode='focus';focusModal()}function startFocus(id){let t=state.tasks.find(t=>t.id===id);openFocus(t?.mins||25)}function focusModal(){document.getElementById('toastArea').innerHTML=`<div id="focus" class="surface rounded-3xl p-6 w-[min(92vw,380px)]"><div class="flex justify-between"><div><p class="muted text-sm">${timer.mode==='focus'?'Sesión de concentración':'Pausa programada'}</p><h2 class="text-xl font-bold mt-1">${timer.mode==='focus'?'Un paso cada vez':'Respira y recarga'}</h2></div><button class="muted text-2xl" onclick="closeFocus()">×</button></div><div class="text-6xl font-bold text-center py-8 tracking-wider" id="timerText">${fmt(timer.seconds)}</div><p class="muted text-center text-sm mb-5" id="timerMsg">${timer.mode==='focus'?'Empieza con solo cinco minutos.':'Te has ganado esta pausa.'}</p><div class="flex gap-2"><button class="flex-1 rounded-xl py-3 font-bold text-white" style="background:var(--accent2)" onclick="toggleTimer()" id="timerBtn">▶ Empezar</button><button class="rounded-xl px-4 py-3 font-bold" style="background:var(--soft)" onclick="resetTimer()">↺</button></div></div>`}
  function toggleTimer(){if(timer.running){clearInterval(timer.interval);timer.running=false;document.getElementById('timerBtn').textContent='▶ Continuar';return}timer.running=true;document.getElementById('timerBtn').textContent='Ⅱ Pausar';timer.interval=setInterval(()=>{timer.seconds--;if(timer.mode==='focus')state.focusSeconds++;let el=document.getElementById('timerText');if(el)el.textContent=fmt(timer.seconds);if(timer.seconds<=0){clearInterval(timer.interval);timer.running=false;if(timer.mode==='focus'){state.sessions++;save();timer.mode='break';timer.seconds=timer.total=5*60;focusModal();toast('Sesión completada. Date una pausa, te la has ganado 🌿')}else closeFocus()}},1000)}function resetTimer(){clearInterval(timer.interval);timer.running=false;timer.seconds=timer.total;focusModal()}function closeFocus(){clearInterval(timer.interval);timer.running=false;document.getElementById('toastArea').innerHTML=''}function toast(msg){let d=document.createElement('div');d.className='toast surface rounded-2xl px-4 py-3 text-sm font-semibold';d.textContent=msg;document.getElementById('toastArea').appendChild(d);setTimeout(()=>d.remove(),3500)}
  function bindTheme(){document.documentElement.classList.toggle('dark',state.theme==='dark');document.getElementById('themeBtn').textContent=state.theme==='dark'?'☾':'☼'}
  bindTheme();showView('today');
  </script>
</body>
</html>
